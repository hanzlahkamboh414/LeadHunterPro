[pytest]
markers =
    network: test performs a real network crawl/request (live discovery or HTTP fetch); deselect with -m "not network"
# Default collection scope: the tests/ subtree only. This excludes the three
# backend root scratch scripts (test_ai.py, test_score.py, test_summary.py)
# from normal pytest collection, so they no longer abort collection with a
# live network call or pollute output. They remain runnable as scripts, e.g.
#   cd backend && python test_ai.py
# (explicit paths still override testpaths when intended).
testpaths = tests
# Default offline-safe: network-marked tests (live crawls/HTTP fetches) are
# deselected from the normal run. To run them explicitly:
#   python -m pytest -m network
#
# --basetemp (roadmap D6): the full suite fails on this Windows machine using
# pytest's default temp root, so every full-suite command had to carry
# `--basetemp=.pytest_tmp` by hand. A flag that must be remembered on every run
# is a flag that will be forgotten, and its absence looks like a code failure
# rather than an invocation mistake — that already cost one verification cycle.
# Making it the default removes the recurring footgun. Accepted trade-off: two
# pytest runs started concurrently in this directory would share the temp root
# and clobber each other; single-developer runs, which is all this repo has, are
# unaffected. `.pytest_tmp/` is gitignored.
addopts = -m "not network" --basetemp=.pytest_tmp