# LeadHunter Pro — SearXNG instance settings (see docker-compose.yml)
#
# JSON output enabled (the provider reads ?format=json), limiter off
# (localhost-only traffic), image proxy off (we never request images).

use_default_settings: true

server:
  # CHANGE THIS on a new install: openssl rand -base64 32
  secret_key: "CHANGE_ME_GENERATE_A_NEW_SECRET"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

# Cap the per-engine fan-out window. Engines that time out from this
# datacenter IP (mwmbl, duckduckgo variants — measured) otherwise eat the
# full default window, pushing every query's response to ~6s, which races
# the backend's request cap and trips the circuit breaker. With a 3s cap
# the slow engines fail fast and the responsive ones (bing, qwant, yandex,
# google) carry the query; responses land well inside the 10s provider cap.
outgoing:
  request_timeout: 3.0

engines:
  # General-web engines — the docker default enables only brave/duckduckgo/
  # google-cse for general web, and all three suspend under a datacenter IP
  # burst (CAPTCHA / too-many-requests). A broader set gives SearXNG
  # redundancy: when 2-3 engines rate-limit, the rest still answer, and
  # SearXNG auto-suspends/re-admits per engine.
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
  - name: mojeek
    disabled: false
  # Second redundancy tier (added 2026-09-12 for multi-user load): with 9
  # general engines a single burst still left only 4-5 answering; these 4
  # brought the measured pool to 11 engines / 71 results per query with
  # mwmbl alone carrying a third of the results.
  - name: yandex
    disabled: false
  - name: yep
    disabled: false
  - name: mwmbl
    disabled: false
  - name: duckduckgo web
    disabled: false
