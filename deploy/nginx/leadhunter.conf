# LeadHunter Pro — nginx vhost (Hostinger VPS, Ubuntu, /etc/nginx/sites-available)
#
# Layout:  nginx serves the built SPA from /var/www/leadhunter (frontend/dist
#          copied there) and proxies /api to the uvicorn backend on 127.0.0.1.
#          The SPA's own requests all go to /api/v1/* (VITE_API_BASE default),
#          so nothing else needs a proxy.
#
# Install:  sudo cp deploy/nginx/leadhunter.conf /etc/nginx/sites-available/leadhunter
#           sudo ln -s /etc/nginx/sites-available/leadhunter /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Live server: leadhuntarpro.online (certbot manages the 443 block + redirect).

server {
    listen 80;
    server_name leadhuntarpro.online www.leadhuntarpro.online 13.60.59.77;

    # gzip the SPA bundles
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /var/www/leadhunter;
    index index.html;

    # index.html must NEVER be heuristic-cached: it references hashed assets
    # that change every deploy, so a cached copy 404s its CSS/JS and the app
    # renders broken. Assets stay long-cached (content-hashed, immutable).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history-mode routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Long-cache hashed assets (index-HASH.css/js)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # The Gmail address export scans the whole mailbox on one request —
    # minutes on a big inbox even with the parallel metadata fetches. It
    # needs a longer read window than the general 120s below (nginx picks
    # the longest matching prefix, so this wins for /api/v1/gmail/export/*).
    location /api/v1/gmail/export/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # Backend: /api -> uvicorn. Buffers are sized for the dashboard's
    # job/progress payloads; the streaming job endpoint pushes events.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;   # job events stream; don't buffer
    }
}